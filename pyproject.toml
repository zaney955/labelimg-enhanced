[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "labelimg-enhanced"
dynamic = ["version"]
description = "An independently maintained LabelImg derivative with enhanced annotation workflows."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Tzutalin and LabelImg contributors" },
]
dependencies = [
    "PyQt5>=5.15.11,<5.16",
    "lxml>=6,<7",
    "comtypes>=1.4.16,<2; platform_system == 'Windows'",
    "numpy>=2.4,<3",
    "opencv-python-headless>=4.13,<6",
    "Pillow>=12.1,<13",
]
keywords = ["annotation", "labelimg", "pascal-voc", "yolo", "createml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
labelImg = "labelimg.workbench.bootstrap:main"

[project.urls]
Repository = "https://github.com/zaney955/labelimg-enhanced"
Upstream = "https://github.com/HumanSignal/labelImg"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "labelimg.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["labelimg*"]

[tool.setuptools.package-data]
labelimg = ["data/*.txt", "data/*.ico"]
