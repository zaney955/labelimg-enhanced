<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="95.75 103.14 832.5 832.5">
  <defs>
    <linearGradient id="panel" x1="226" y1="214" x2="805" y2="821" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9F4F8"/>
      <stop offset=".48" stop-color="#B8E4ED"/>
      <stop offset="1" stop-color="#80C4D2"/>
    </linearGradient>
    <linearGradient id="panelRim" x1="220" y1="212" x2="810" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9EEEE"/>
      <stop offset=".48" stop-color="#79C9C9"/>
      <stop offset="1" stop-color="#0C7172"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="236" y1="450" x2="684" y2="814" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65D6D1"/>
      <stop offset="1" stop-color="#269F9B"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="431" y1="540" x2="822" y2="817" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40BBB7"/>
      <stop offset="1" stop-color="#137D7A"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F3FFFF"/>
      <stop offset="1" stop-color="#CBE9E9"/>
    </linearGradient>
    <linearGradient id="bracketRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#E8FFFF"/>
      <stop offset="1" stop-color="#B7DCDD"/>
    </linearGradient>
    <filter id="panelShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#167E7D" flood-opacity=".22"/>
    </filter>
    <filter id="bracketShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#126E6D" flood-opacity=".18"/>
    </filter>
    <filter id="guideShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#177B79" flood-opacity=".24"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="190" y="205" width="644" height="602" rx="64"/>
    </clipPath>
  </defs>

  <g transform="translate(512 506) scale(1.12) translate(-512 -506)">
      <!-- C: central image panel -->
      <g filter="url(#panelShadow)">
        <rect x="190" y="205" width="644" height="602" rx="64" fill="url(#panel)"/>
        <rect x="193" y="208" width="638" height="596" rx="61" fill="none" stroke="url(#panelRim)" stroke-width="10"/>
      </g>

      <!-- D and E: image subject and composition grid -->
      <g clip-path="url(#panelClip)">
        <circle cx="608" cy="395" r="69" fill="#FFF3C7" stroke="#E2C982" stroke-width="4"/>
        <path d="M196 603 339 447c14-15 34-15 49-1l250 257v104H196Z" fill="url(#mountainBack)"/>
        <path d="M425 807 639 552c14-17 37-18 53-4l149 136v123Z" fill="url(#mountainFront)"/>
        <path d="m342 447 112 116-81 96-105-111Z" fill="#78DCD8"/>
        <path d="m640 553 85 77-119 142-81-97Z" fill="#43BEB9"/>
        <path d="m196 603 143-156 34 35-130 177Z" fill="#72D8D3"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" filter="url(#guideShadow)">
          <path d="M112 514h801" stroke-dasharray="28 24"/>
          <path d="M414 172v684" stroke-dasharray="30 26"/>
          <path d="M643 172v684" stroke-dasharray="30 26"/>
        </g>
      </g>

      <!-- F: opaque crop brackets -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="url(#bracketRim)" stroke-width="54" filter="url(#bracketShadow)">
          <path d="M290 205H190v100M734 205h100v100M190 707v100h100M734 807h100V707"/>
        </g>
        <g stroke="url(#bracket)" stroke-width="46">
          <path d="M290 205H190v100M734 205h100v100M190 707v100h100M734 807h100V707"/>
        </g>
      </g>
  </g>
</svg>
