<svg xmlns="http://www.w3.org/2000/svg" width="468" height="468" viewBox="0 0 468 445" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="outerFrame" x1="234" y1="22" x2="234" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFBFD"/>
      <stop offset="0.48" stop-color="#F2F3F6"/>
      <stop offset="1" stop-color="#D9DCE2"/>
    </linearGradient>
    <linearGradient id="outerEdge" x1="234" y1="25" x2="234" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8CBD2"/>
    </linearGradient>
    <radialGradient id="sceneBg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(242 88) rotate(90) scale(280 260)">
      <stop stop-color="#BBD8FF"/>
      <stop offset="0.52" stop-color="#84B3F1"/>
      <stop offset="1" stop-color="#477CC7"/>
    </radialGradient>
    <linearGradient id="mountainFar" x1="100" y1="112" x2="267" y2="321" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F94E0"/>
      <stop offset="1" stop-color="#315CA9"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="150" y1="173" x2="286" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31589D"/>
      <stop offset="1" stop-color="#173B7E"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="66" y1="251" x2="366" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#90CE69"/>
      <stop offset="1" stop-color="#4F9D43"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="131" y1="263" x2="382" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8D977"/>
      <stop offset="1" stop-color="#3D843B"/>
    </linearGradient>
    <linearGradient id="yellowBar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFD85A"/>
      <stop offset="0.56" stop-color="#FFC23B"/>
      <stop offset="1" stop-color="#E8A91E"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE176"/>
      <stop offset="0.52" stop-color="#FFC13A"/>
      <stop offset="1" stop-color="#D99818"/>
    </linearGradient>
    <linearGradient id="cursor" x1="342" y1="284" x2="397" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F4F4F4"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
    <filter id="innerShadow" x="48" y="47" width="374" height="349" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#214B83" flood-opacity="0.65"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#163C76" flood-opacity="0.40"/>
    </filter>
    <filter id="objectShadow" x="-50%" y="-50%" width="220%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#27303B" flood-opacity="0.45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
    <clipPath id="sceneClip">
      <rect x="72" y="64" width="328" height="316" rx="48"/>
    </clipPath>
  </defs>

  <!-- outer iOS-style frame without external shadow -->
  <rect x="36" y="22" width="401" height="406" rx="78" fill="url(#outerFrame)" stroke="url(#outerEdge)" stroke-width="4"/>
  <rect x="52" y="39" width="369" height="372" rx="64" fill="#E9EBF0"/>

  <!-- inset image panel -->
  <g filter="url(#innerShadow)">
    <rect x="70" y="62" width="332" height="320" rx="51" fill="url(#sceneBg)" stroke="#6486BC" stroke-width="2"/>
  </g>

  <g clip-path="url(#sceneClip)" filter="url(#grain)">
    <rect x="72" y="64" width="328" height="316" fill="url(#sceneBg)"/>

    <path d="M72 236L128 126C135 113 141 104 149 105C159 106 168 123 177 137L194 111C200 102 208 102 214 111L297 236H72Z" fill="url(#mountainFar)"/>
    <path d="M112 145L132 112C141 98 150 101 159 116L169 132L178 142L166 137L155 143L146 131L136 143L123 146L112 145Z" fill="#F5F8FF"/>
    <path d="M176 140L194 110C200 102 207 103 213 112L225 130L214 126L204 135L195 126L186 140L176 140Z" fill="#D8E5FB"/>

