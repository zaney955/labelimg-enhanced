    <path d="M203 302L291 207C299 198 306 198 314 208L352 254L371 238C378 232 384 234 390 240L414 271V320L203 302Z" fill="#254F9C"/>
    <path d="M261 255L289 218C295 210 302 210 309 218L322 236L311 231L302 240L293 231L283 243L274 241L261 255Z" fill="#3F6DB9" opacity="0.72"/>

    <g filter="url(#softShadow)">
      <path d="M240 143C231 143 224 136 224 127C224 118 231 111 240 111C244 111 248 112 251 115C254 99 267 88 283 88C300 88 313 100 315 116C319 113 324 111 330 111C342 111 352 121 352 133C352 139 347 144 341 144H240V143Z" fill="#F7F8FB"/>
      <path d="M241 139H341C346 139 350 136 351 132C351 139 347 145 341 145H240C231 145 224 138 224 129C224 128 224 127 224 126C225 133 232 139 241 139Z" fill="#DDE2EC" opacity="0.78"/>
    </g>

    <path d="M72 286C114 280 151 289 186 310C225 282 268 267 310 259C348 251 379 248 402 254V382H72V286Z" fill="url(#hillBack)"/>
    <path d="M72 324C114 298 147 296 182 315C206 328 227 344 250 355C292 322 329 298 402 287V382H72V324Z" fill="url(#hillFront)"/>
    <path d="M228 382C273 342 317 314 402 288V382H228Z" fill="#3C833C" opacity="0.52"/>
    <path d="M70 354C106 333 141 328 177 337C208 345 229 366 250 382H70V354Z" fill="#4D9A42" opacity="0.46"/>
  </g>

  <g filter="url(#objectShadow)">
    <rect x="124" y="181" width="240" height="155" rx="4" stroke="url(#yellowBar)" stroke-width="8"/>
    <rect x="111" y="167" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <rect x="233" y="167" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <rect x="349" y="167" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <rect x="111" y="319" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <rect x="233" y="319" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <rect x="349" y="319" width="31" height="33" rx="7" fill="url(#handle)" stroke="#E2A21D" stroke-width="1.5"/>
    <path d="M117 174H136" stroke="#FFF3A4" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
    <path d="M239 174H258" stroke="#FFF3A4" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
    <path d="M355 174H374" stroke="#FFF3A4" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
  </g>

  <!-- cursor with repaired head -->
  <g filter="url(#objectShadow)">
    <path d="M338 286L411 333L381 346L398 380C400 384 398 389 393 392L383 398C378 401 372 399 369 394L353 362L342 385C339 392 330 391 329 383L326 295C326 289 332 284 338 286Z" fill="url(#cursor)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M381 346L398 380C400 384 398 389 393 392L387 395L368 357L381 346Z" fill="#C9C9C9" opacity="0.78"/>
    <path d="M338 288L401 330" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.78"/>
  </g>

  <!-- continuous top highlight -->
  <path d="M95 56C102 53 111 52 121 52H357C389 52 410 74 410 106" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M76 90C72 98 70 107 70 117V352" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
</svg>
