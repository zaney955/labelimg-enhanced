name: Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft-release:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Require an annotated, version-matched tag
        shell: pwsh
        run: |
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagLine = @(git ls-remote --tags origin $tagRef)
          $peeledLine = @(git ls-remote --tags origin "${tagRef}^{}")
          if ($tagLine.Count -ne 1 -or $peeledLine.Count -ne 1) { exit 1 }
          $tagObject = ($tagLine[0] -split "\s+")[0]
          $tagCommit = ($peeledLine[0] -split "\s+")[0]
          if ((git cat-file -t $tagObject) -ne "tag") { exit 1 }
          if ((git rev-parse HEAD) -ne $tagCommit) { exit 1 }
          python tools/validate_release.py --tag $env:RELEASE_TAG

      - name: Install test, bundle, and build dependencies
        run: python -m pip install --upgrade pip build pyinstaller
      - name: Install application
        run: python -m pip install .
      - name: Run tests
        run: python tools/run_tests.py
        env:
          LABELIMG_CONFIG_DIR: ${{ runner.temp }}

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validate built wheel contents
        run: python -B -m unittest discover -s tests/packaging -p test_wheel_contract.py
      - name: Validate wheel identity
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist -Filter *.whl)
          if ($wheels.Count -ne 1) { exit 1 }
          python tools/validate_release.py --tag $env:RELEASE_TAG --wheel $wheels[0].FullName

      - name: Build PyInstaller onedir application
        run: python -m PyInstaller --clean --noconfirm packaging/labelimg-enhanced.spec
      - name: Smoke-test frozen workbench imports
        run: >-
          python tools/smoke_test_windows_bundle.py
          dist/LabelImgEnhanced/LabelImgEnhanced.exe
      - name: Build unsigned per-user installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\labelimg-enhanced.iss"
          $installer = Get-Item "dist\installer\LabelImg-Enhanced-$version-windows-x64-setup.exe"
          python tools/validate_release.py --tag $env:RELEASE_TAG --installer $installer.FullName

      - name: Stage release assets and generate SHA-256 manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\*.whl release-assets\
          Copy-Item dist\installer\*.exe release-assets\
          $lines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content -Path release-assets\SHA256SUMS -Value $lines -Encoding utf8NoBOM

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG $assets --draft --verify-tag --generate-notes
