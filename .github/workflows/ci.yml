name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install "PyQt5>=5.15.11,<5.16" "lxml>=6,<7"
      - name: Run tests
        run: python tools/run_tests.py
        env:
          LABELIMG_CONFIG_DIR: ${{ runner.temp }}
      - name: Build wheel
        run: python -m pip wheel . --no-deps
