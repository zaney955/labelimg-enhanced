name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, shard-index ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install .
      - name: Run tests
        run: >-
          python tools/run_tests.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4
          --timeout-seconds 900
        env:
          LABELIMG_CONFIG_DIR: ${{ runner.temp }}

  wheel:
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validate built wheel contents
        run: python -B -m unittest discover -s tests/packaging -p test_wheel_contract.py
